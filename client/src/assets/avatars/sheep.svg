<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky Blue Background -->
  <circle cx="50" cy="50" r="48" fill="#BAE6FD" />

  <!-- Fluffy Cloud Wool (Outer Ring) -->
  <g fill="#FFFFFF">
    <circle cx="50" cy="24" r="12" />
    <circle cx="63" cy="27" r="12" />
    <circle cx="73" cy="35" r="12" />
    <circle cx="79" cy="47" r="12" />
    <circle cx="78" cy="61" r="12" />
    <circle cx="72" cy="72" r="12" />
    <circle cx="62" cy="80" r="12" />
    <circle cx="50" cy="82" r="12" />
    <circle cx="38" cy="80" r="12" />
    <circle cx="28" cy="72" r="12" />
    <circle cx="22" cy="61" r="12" />
    <circle cx="21" cy="47" r="12" />
    <circle cx="27" cy="35" r="12" />
    <circle cx="37" cy="27" r="12" />
    <!-- Wool Body Fill -->
    <circle cx="50" cy="52" r="32" />
  </g>

  <!-- Floppy Side Ears -->
  <ellipse cx="20" cy="46" rx="10" ry="5.5" fill="#FEF3C7" transform="rotate(-15 20 46)" />
  <ellipse cx="20" cy="46" rx="6.5" ry="3" fill="#FDA4AF" transform="rotate(-15 20 46)" />
  <ellipse cx="80" cy="46" rx="10" ry="5.5" fill="#FEF3C7" transform="rotate(15 80 46)" />
  <ellipse cx="80" cy="46" rx="6.5" ry="3" fill="#FDA4AF" transform="rotate(15 80 46)" />

  <!-- Soft Warm Face -->
