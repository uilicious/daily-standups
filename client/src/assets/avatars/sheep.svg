  <!-- Fluffy Wool Forehead Tuft -->
  <g fill="#FFFFFF">
    <circle cx="50" cy="40" r="9" />
    <circle cx="42" cy="42" r="8" />
    <circle cx="58" cy="42" r="8" />
    <circle cx="46" cy="34" r="7" />
    <circle cx="54" cy="34" r="7" />
  </g>

  <!-- Sweet Eyes -->
  <circle cx="42" cy="55" r="3.2" fill="#1E293B" />
  <circle cx="43" cy="54" r="1.1" fill="#FFFFFF" />
  <circle cx="58" cy="55" r="3.2" fill="#1E293B" />
  <circle cx="59" cy="54" r="1.1" fill="#FFFFFF" />

  <!-- Pink Nose & Smile -->
  <polygon points="47,62 53,62 50,65" fill="#F472B6" />
  <path d="M47,67 Q50,70 53,67" stroke="#F472B6" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <circle cx="35" cy="61" r="3.5" fill="#FDA4AF" opacity="0.6" />
  <circle cx="65" cy="61" r="3.5" fill="#FDA4AF" opacity="0.6" />
