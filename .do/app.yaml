name: daily-standups
region: nyc
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    dockerfilePath: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: DB_CLIENT
        value: pg
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace-with-a-random-32-char-secret-string
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: adminpassword123
      - key: APP_URL
        value: ${APP_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
    cluster_name: daily-standups-db
